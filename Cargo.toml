[workspace]
members = [
    "crates/file-formatter-core",
    "crates/file-formatter-cli",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.3.5"
edition = "2024"

[workspace.lints.rust]
# Windows Shell integration is isolated in one small, reviewed FFI module.
# Keep unsafe code denied everywhere else while allowing that module to opt in.
unsafe_code = "deny"
