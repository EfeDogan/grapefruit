name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "website/**"
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Fetch pinned conversion tools
        shell: pwsh
        run: ./scripts/fetch-windows-tools.ps1

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build NSIS installer
        run: pnpm --dir apps/desktop tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
